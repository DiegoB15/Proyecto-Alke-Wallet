<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Menú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/CSS/style.css">
</head>

<body>
    <header>
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 m-0 text-white">💰 Alke Wallet 💰</h1>
            <a href="login.html" class="btn btn-outline-light btn-sm">Salir</a>
        </div>
    </header>

    <main class="container mt-5">
        <section class="text-center mb-5">
            <h1 class="fw-light">Bienvenido 😊</h1>
            <p class="lead">Tu saldo disponible es:</p>
            <h2 class="display-4 fw-bold text-success" id="saldo">$1.000.000</h2>
        </section>

        <section class="row g-4">
            <div class="col-md-4">
                <div class="card text-center h-100 py-4">
                    <div class="card-body">
                        <h3>📥</h3>
                        <h5 class="card-title">Depositar</h5>
                        <p class="card-text">Agrega dinero a tu cuenta.</p>
                        <button id="btnDepositar" class="btn btn-primary">Ir a Depositar</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center h-100 py-4">
                    <div class="card-body">
                        <h3>💸</h3>
                        <h5 class="card-title">Enviar Dinero</h5>
                        <p class="card-text">Transfiere a tus contactos.</p>
                        <button id="btnEnviar" class="btn btn-primary">Ir a Enviar</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center h-100 py-4">
                    <div class="card-body">
                        <h3>📊</h3>
                        <h5 class="card-title">Movimientos</h5>
                        <p class="card-text">Revisa tu historial.</p>
                        <button id="btnMovimientos" class="btn btn-primary">Ver Historial</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Alke Wallet "D.B". Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

        <script src="assets/JS/jquery-3.7.1.min.js"></script>

    <script src="assets/JS/script.js"></script>
</body>

</html>
