<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depositar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="assets/CSS/style.css">
</head>

<body>
    <header>
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 m-0 text-white">📥 Depositar Fondos 📥</h1>
            <a href="menu.html" class="btn btn-outline-light btn-sm"> ← Volver al Menú</a>
        </div>
    </header>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 mt-4">
                    <h2 class="text-center mb-4">Realizar Depósito</h2>
                    <p class="text-center">Saldo actual: <strong id="saldoActual"></strong></p>

                    <form id="depositForm">
                        <div class="mb-3">
                            <label for="depositAmount" class="form-label">Monto a depositar</label>
                            <input type="number" class="form-control form-control-lg" id="depositAmount"
                                placeholder="$ 0">
                        </div>
                        <button type="submit" class="btn btn-success w-100 btn-lg">Depositar Ahora</button>
                    </form>
                    <div id="mensaje" class="mt-3 text-center fw-bold" ></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Alke Wallet "D.B". Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="assets/JS/jquery-3.7.1.min.js"></script>

    <script src="assets/JS/script.js"></script>
</body>

</html>
