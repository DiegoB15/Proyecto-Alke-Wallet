<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="assets/CSS/style.css">
</head>

<body>
    <header>
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 m-0 text-white">🔒 Alke Wallet 🔒</h1>
        </div>
    </header>

    <main class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card p-4">
                    <img src="assets/IMG/295128.png" width="80" class="mb-3" alt="Login Icon">
                    <h2 class="text-center mb-4">Iniciar Sesión</h2>
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="correo" placeholder="hola@gmail.com">
                    </div>
                    <div class="mb-3">
                        <label for="clave" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="clave" placeholder="1234">
                    </div>
                    <button id="loginBtn" class="btn btn-primary w-100 py-2">Ingresar</button>
                    <div id="error" class="text-center mt-3 fw-bold"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Alke Wallet "D.B". Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

        <script src="assets/JS/jquery-3.7.1.min.js"></script>

    <script src="assets/JS/script.js"></script>
</body>

</html>
